services:
  nginx:
    image: nginx:alpine
    container_name: nq_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - nq_network
    restart: unless-stopped
    labels:
      - "com.docker.compose.project=nq"

  certbot:
    image: certbot/certbot:latest
    container_name: nq_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    labels:
      - "com.docker.compose.project=nq"

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nq_backend
    environment:
      - ENV=production
      - PORT=8080
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=neo4j
      - ALLOWED_ORIGINS=https://nq.nathangrilliot.com,https://nathangrilliot.com
      - GQL_IP_ADDR=https://nq.nathangrilliot.com
      - ENABLE_TLS=false
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - nq_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/main", "-health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.docker.compose.project=nq"

  neo4j:
    image: neo4j:latest
    container_name: nq_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_backups:/backups
    networks:
      - nq_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "com.docker.compose.project=nq"

volumes:
  neo4j_data:
    name: nq_neo4j_data
  neo4j_logs:
    name: nq_neo4j_logs
  neo4j_backups:
    name: nq_neo4j_backups
  certbot_certs:
    name: nq_certbot_certs
  certbot_www:
    name: nq_certbot_www

networks:
  nq_network:
    name: nq_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16