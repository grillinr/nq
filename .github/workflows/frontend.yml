# This workflow will test the Expo/React Native frontend
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Frontend

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: nq-frontend/package-lock.json

    - name: Install dependencies
      run: cd nq-frontend/ && npm ci

    - name: Lint
      run: cd nq-frontend/ && npm run lint

    - name: Type check
      run: cd nq-frontend/ && npx tsc --noEmit

    - name: Run tests
      run: cd nq-frontend/ && npm test
